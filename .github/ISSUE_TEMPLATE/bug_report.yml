name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: App version
      description: Agent Command Center → About
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.1, Apple M3"
  - type: input
    id: tmux
    attributes:
      label: tmux version
      description: Output of `tmux -V`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from `~/Library/Application Support/Agent Command Center/server.log` or `autosave.log`
      render: text
